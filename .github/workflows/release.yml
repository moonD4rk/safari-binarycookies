name: Release

# Manual release. Dispatch with a semver version; this bumps the crate version
# on a release/v<version> branch, publishes to crates.io via OIDC Trusted
# Publishing, tags + creates the GitHub Release, then opens an auto-merging PR
# back to main.
#
# Requires two repo secrets for the GitHub App used to push the release branch
# and open/merge the PR (the default GITHUB_TOKEN cannot trigger CI on the PR it
# opens): RELEASE_APP_ID, RELEASE_APP_PRIVATE_KEY.
#
# crates.io Trusted Publishing must be configured for `safari-binarycookies`
# (Repository moonD4rk/safari-binarycookies, Workflow release.yml, no
# environment). crates.io has no pending-publisher feature, so the crate's first
# version must be published once by hand (`cargo publish` with a scoped API
# token) to create it; the Trusted Publisher can only be configured afterwards,
# and OIDC takes over for every release from then on.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected semver without leading v, e.g. 0.1.0)"
            exit 1
          fi

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Bump crate version
        env:
          VERSION: ${{ inputs.version }}
        run: cargo set-version "$VERSION"

      - name: Commit version bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "release/v${VERSION}"
          git commit -am "chore: release ${VERSION}"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Push branch, tag and GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git push origin "release/v${VERSION}"
          gh release create "v${VERSION}" \
            --target "release/v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes

      - name: Open PR to merge bump into main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "release/v${VERSION}" \
            --title "chore: release ${VERSION}" \
            --body "Version bump for \`${VERSION}\`, already published to crates.io by the release workflow.")
          gh pr merge "$PR_URL" --auto --squash --delete-branch
