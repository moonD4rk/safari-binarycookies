[package]
name = "safari-binarycookies"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["CIXTOR (original implementation)", "moonD4rk"]
description = "Dependency-light, panic-free Rust decoder for Safari/WebKit .binarycookies cookie files."
repository = "https://github.com/moonD4rk/safari-binarycookies"
homepage = "https://github.com/moonD4rk/safari-binarycookies"
documentation = "https://docs.rs/safari-binarycookies"
readme = "README.md"
keywords = ["safari", "cookies", "binarycookies", "webkit", "parser"]
categories = ["parser-implementations", "encoding"]
# Keep the published tarball lean: source + README + LICENSE only. /tests is
# excluded because it include_bytes!-es /testdata, which never ships; repo-meta
# docs and tool configs stay out of the registry artifact too.
exclude = [
  "/.github",
  "/rfc2rust",
  "/fuzz",
  "/testdata",
  "/tests",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/CLAUDE.local.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/deny.toml",
  "/rustfmt.toml",
  "/clippy.toml",
  "/.cargo",
  "/.editorconfig",
  "*.binarycookies",
]

# edition 2024 implies the MSRV-aware resolver (v3); not hand-written.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Held in the public API (Cookie.expires/creation). The `serde` feature adds
# `time/serde-well-known` for RFC 3339; the base dependency stays featureless.
time = { version = ">=0.3.20, <0.4", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = ["std"]
std = []
serde = ["dep:serde", "time/serde-well-known"]
display = []

[dev-dependencies]
serde_json = "1" # golden-JSON parity tests
proptest = "1"   # property tests

# Strict lint baseline: `clippy::all` + `pedantic` denied, `nursery`/`cargo`
# warned, CI treats warnings as errors. Test code carries `#![expect(...)]`
# overrides at the file top (unwrap/expect/panic) per project convention.
[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
unused_must_use = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
let_underscore = { level = "warn", priority = -1 }
unreachable_pub = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
elided_lifetimes_in_paths = "warn"
single_use_lifetimes = "warn"
unused_results = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Elevations above clippy::all
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unreachable = "deny"
mem_forget = "deny"
get_unwrap = "deny"
exit = "warn"
indexing_slicing = "warn"

# Attribute hygiene: prefer `#[expect]` over `#[allow]` so stale suppressions
# self-report, and require a reason on every suppression.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Catch accidental use of std APIs newer than the declared `rust-version`.
incompatible_msrv = "deny"

# Pedantic / nursery / cargo lints that are too noisy in practice. Documented
# allows rather than silent skips so future contributors see them.
# `missing_errors_doc` and `must_use_candidate` are deliberately NOT exempted:
# they enforce `# Errors` sections and `#[must_use]` markers.
module_name_repetitions = "allow" # nested types like model::Cookie are fine
multiple_crate_versions = "allow" # transitive deps frequently disagree
doc_markdown = "allow"            # false positives on acronyms like WebKit
redundant_pub_crate = "allow"     # crate-internal visibility preferred for clarity

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
