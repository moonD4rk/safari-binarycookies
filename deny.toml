# Configuration for `cargo deny check`.
# See https://embarkstudios.github.io/cargo-deny/

[graph]
# Check direct + transitive dependencies on the most common targets.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
  { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
# Fail on any unresolved RustSec advisory.
yanked = "deny"

[licenses]
version = 2
# This crate is Apache-2.0; its dependencies are MIT / Apache-2.0. Only licenses
# the current dependency graph actually needs are allowed: grow this list per
# `cargo deny check` report, annotating the source crate — never pre-emptively.
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0", # unicode-ident (transitive via syn, from serde/thiserror derive macros)
]
confidence-threshold = 0.8
# Any crate's license must be discoverable; no exceptions.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
